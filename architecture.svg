<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DriftPatch production architecture</title>
  <desc id="desc">A judge uploads baseline and current CSV or JSON sources, pipeline configuration, and contract through Cloudflare to public Cloud Run. Private admission stores an ephemeral bundle and Cloud Tasks invokes an internal ADK worker screened by Model Armor. A deterministic result controller independently replays the repair before atomically writing configuration, rollback history, and receipt to Firestore.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#D94F1E"/>
    </marker>
    <style>
      .label { font: 600 13px "IBM Plex Sans", Arial, sans-serif; fill: #1D1D1F; }
      .meta { font: 400 11px "IBM Plex Sans", Arial, sans-serif; fill: #656260; }
      .code { font: 600 11px "Source Code Pro", monospace; fill: #A93712; }
      .node { fill: #FFFFFF; stroke: #CFCBC6; stroke-width: 1.5; }
      .control { fill: #FFF1E8; stroke: #D94F1E; stroke-width: 2; }
      .line { fill: none; stroke: #D94F1E; stroke-width: 2; marker-end: url(#arrow); }
      .read { fill: none; stroke: #6E6A67; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#FBFAF8"/>
  <text x="40" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#1D1D1F">DriftPatch</text>
  <text x="40" y="78" class="meta">Custom source bundles in. Verified configuration or safe escalation out.</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#CFCBC6"/>

  <rect class="node" x="40" y="140" width="140" height="112" rx="6"/>
  <text class="label" x="60" y="172">Judge browser</text>
  <text class="meta" x="60" y="197">Public interface</text>
  <text class="meta" x="60" y="218">No Cloud authority</text>

  <rect class="node" x="210" y="140" width="140" height="112" rx="6"/>
  <text class="label" x="230" y="172">Cloudflare edge</text>
  <text class="code" x="230" y="197">Worker proxy</text>
  <text class="meta" x="230" y="218">TLS · proxy · CDN</text>

  <rect class="node" x="380" y="140" width="150" height="112" rx="6"/>
  <text class="label" x="400" y="172">Public service</text>
  <text class="code" x="400" y="197">Cloud Run</text>
  <text class="meta" x="400" y="218">Invoke admission only</text>

  <rect class="control" x="560" y="140" width="170" height="112" rx="6"/>
  <text class="label" x="580" y="172">Admission</text>
  <text class="code" x="580" y="197">validate + enqueue</text>
  <text class="meta" x="580" y="218">Quota · bundle reference</text>

  <rect class="node" x="760" y="140" width="160" height="112" rx="6"/>
  <text class="label" x="780" y="172">Cloud Tasks</text>
  <text class="code" x="780" y="197">named attempt</text>
  <text class="meta" x="780" y="218">OIDC · bounded retry</text>

  <rect class="control" x="950" y="140" width="210" height="112" rx="6"/>
  <text class="label" x="970" y="172">Model worker</text>
  <text class="code" x="970" y="197">Gemini 3.5 Flash</text>
  <text class="meta" x="970" y="218">gemini-embedding-001 · Armor</text>
  <text class="meta" x="970" y="238">Opaque IDs · advisory hints</text>

  <path class="line" d="M 180 196 H 210"/>
  <path class="line" d="M 350 196 H 380"/>
  <path class="line" d="M 530 196 H 560"/>
  <path class="line" d="M 730 196 H 760"/>
  <path class="line" d="M 920 196 H 950"/>

  <rect class="node" x="40" y="350" width="190" height="112" rx="6"/>
  <text class="label" x="60" y="382">Private source bundles</text>
  <text class="code" x="60" y="407">Cloud Storage</text>
  <text class="meta" x="60" y="428">Generation · digest · one day</text>

  <rect class="node" x="280" y="350" width="170" height="112" rx="6"/>
  <text class="label" x="300" y="382">Schedulers</text>
  <text class="code" x="300" y="407">watch + reconcile</text>
  <text class="meta" x="300" y="428">Distinct OIDC identities</text>

  <rect class="node" x="500" y="350" width="190" height="134" rx="6"/>
  <text class="label" x="520" y="382">Firestore</text>
  <text class="code" x="520" y="407">atomic transaction</text>
  <text class="meta" x="520" y="430">Active configuration</text>
  <text class="meta" x="520" y="450">Rollback history · receipt</text>

  <rect class="control" x="740" y="350" width="190" height="134" rx="6"/>
  <text class="label" x="760" y="382">Result controller</text>
  <text class="code" x="760" y="407">rebuild + full replay</text>
  <text class="meta" x="760" y="430">Unique shortest program</text>
  <text class="meta" x="760" y="450">Sole configuration writer</text>

  <rect class="node" x="980" y="350" width="180" height="112" rx="6"/>
  <text class="label" x="1000" y="382">Telemetry API</text>
  <text class="code" x="1000" y="407">authenticated OTLP</text>
  <text class="meta" x="1000" y="428">No model content</text>

  <path class="line" d="M 365 350 V 300 H 645 V 252"/>
  <path class="read" d="M 230 406 H 535 Q 560 406 560 381 V 270 Q 560 252 578 252"/>
  <path class="line" d="M 1060 252 V 300 H 835 V 350"/>
  <path class="line" d="M 740 417 H 690"/>
  <path class="read" d="M 595 350 V 300 H 650 Q 670 300 670 252"/>
  <path class="read" d="M 1060 252 V 320 H 1070 V 350"/>

  <text class="meta" x="440" y="289">watch</text>
  <text class="meta" x="716" y="333">typed proposal</text>
  <text class="meta" x="700" y="407">write</text>
  <text class="meta" x="614" y="289">status</text>
  <text class="meta" x="1078" y="307">traces</text>

  <rect x="40" y="548" width="1120" height="112" rx="6" fill="#F2F0ED" stroke="#CFCBC6"/>
  <text class="label" x="64" y="581">Security boundary</text>
  <text class="meta" x="64" y="608">Raw rows never enter model content or traces. The models cannot access the ledger, queue, storage tools, or configuration writer.</text>
  <text class="meta" x="64" y="633">Only an authorized, minimal program that preserves keys, values, schema, types, rows, and uniqueness can become active.</text>
</svg>
